<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astro Pisces</title>
<meta name="description" content="Your birth chart, transits through time and astrology games.">
<meta name="theme-color" content="#f2f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08121f" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Astro Pisces">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="lib/astronomy.browser.min.js"></script>
<style>
/* Look: a night-sky jewel box. Pearl (light) or deep-sea navy (dark) paper under a soft turquoise/pink aurora,
   rounded cards with a gradient hairline edge, pill buttons, glowing circles. Cormorant for titles, Alegreya for reading,
   Alegreya Sans for small labels and numbers. Greek letters fall back to Noto Serif Display. */
:root{
  --paper:#f2f7fb; --paper-2:#e6eff6; --card:#ffffff; --card-2:#f7fbfd;
  --ink:#1a2f55; --ink-soft:#56708f; --ink-line:rgba(26,47,85,.30); --line:rgba(26,47,85,.12);
  --teal:#11858e; --turq:#3cc4c0; --sky:#8ecae6; --sky-ink:#3d86b8;
  --pink:#c93a72; --rose:#ef8fb3; --blush:#fbe3ec;
  --fire:#c93a72; --earth:#6a78bd; --air:#3d86b8; --water:#11858e;
  --fire-wash:rgba(239,143,179,.20); --earth-wash:rgba(130,144,214,.16); --air-wash:rgba(142,202,230,.26); --water-wash:rgba(60,196,192,.16);
  --sel-wash:rgba(239,143,179,.24); --tband:rgba(251,227,236,.6); --dot:rgba(61,134,184,.22);
  --aur-1:rgba(60,196,192,.22); --aur-2:rgba(239,143,179,.24); --aur-3:rgba(142,202,230,.30);
  --edge:linear-gradient(140deg,rgba(60,196,192,.55),rgba(26,47,85,.10) 38%,rgba(26,47,85,.10) 62%,rgba(239,143,179,.65));
  --grad:linear-gradient(120deg,#2fb7b8,#4f8fd0 48%,#e2588f);
  --grad-soft:linear-gradient(135deg,rgba(60,196,192,.16),rgba(239,143,179,.18));
  --shadow:0 1px 2px rgba(26,47,85,.05),0 10px 30px -12px rgba(26,47,85,.22);
  --shadow-lift:0 2px 4px rgba(26,47,85,.06),0 18px 40px -14px rgba(26,47,85,.30);
  --glow:0 0 0 4px rgba(239,143,179,.22);
  --lilac:#9b86d6; --pearl:linear-gradient(115deg,rgba(110,224,216,.20),rgba(196,170,240,.18) 45%,rgba(255,170,200,.20)); --bubble:rgba(255,255,255,.75);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --f-display:"Cormorant Garamond","Noto Serif Display",Georgia,serif;
  --f-italic:"Cormorant Garamond","Noto Serif Display",Georgia,serif;
  --f-body:"Alegreya","Noto Serif Display",Georgia,serif;
  --f-label:"Alegreya Sans","Helvetica Neue",sans-serif;
  --f-mono:"Alegreya Sans","Helvetica Neue",sans-serif;
  --f-script:"Pinyon Script","Cormorant Garamond",Georgia,cursive;
  --f-glyph:"Noto Sans Symbols","Segoe UI Symbol","Apple Symbols",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#08121f; --paper-2:#0f1e33; --card:#0f1d31; --card-2:#13243c;
  --ink:#eaf2f9; --ink-soft:#9fb5cc; --ink-line:rgba(234,242,249,.30); --line:rgba(234,242,249,.10);
  --teal:#4fd1c5; --turq:#6ee0d8; --sky:#8ecae6; --sky-ink:#8ecae6;
  --pink:#ff7eab; --rose:#ffa3c4; --blush:#3a2442;
  --fire:#ff7eab; --earth:#a3adf0; --air:#8ecae6; --water:#4fd1c5;
  --fire-wash:rgba(255,126,171,.13); --earth-wash:rgba(163,173,240,.11); --air-wash:rgba(142,202,230,.13); --water-wash:rgba(79,209,197,.12);
  --sel-wash:rgba(255,126,171,.22); --tband:rgba(255,126,171,.08); --dot:rgba(200,225,245,.30);
  --aur-1:rgba(79,209,197,.13); --aur-2:rgba(255,126,171,.12); --aur-3:rgba(80,120,220,.16);
  --edge:linear-gradient(140deg,rgba(110,224,216,.45),rgba(234,242,249,.08) 38%,rgba(234,242,249,.08) 62%,rgba(255,126,171,.5));
  --grad:linear-gradient(120deg,#3cc4c0,#5f8fe0 48%,#ff7eab);
  --grad-soft:linear-gradient(135deg,rgba(79,209,197,.12),rgba(255,126,171,.12));
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 20px 44px -16px rgba(0,0,0,.7);
  --glow:0 0 0 4px rgba(255,126,171,.18);
  --lilac:#c3b0f5; --pearl:linear-gradient(115deg,rgba(110,224,216,.10),rgba(196,170,240,.10) 45%,rgba(255,126,171,.10)); --bubble:rgba(200,230,255,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#08121f; --paper-2:#0f1e33; --card:#0f1d31; --card-2:#13243c;
  --ink:#eaf2f9; --ink-soft:#9fb5cc; --ink-line:rgba(234,242,249,.30); --line:rgba(234,242,249,.10);
  --teal:#4fd1c5; --turq:#6ee0d8; --sky:#8ecae6; --sky-ink:#8ecae6;
  --pink:#ff7eab; --rose:#ffa3c4; --blush:#3a2442;
  --fire:#ff7eab; --earth:#a3adf0; --air:#8ecae6; --water:#4fd1c5;
  --fire-wash:rgba(255,126,171,.13); --earth-wash:rgba(163,173,240,.11); --air-wash:rgba(142,202,230,.13); --water-wash:rgba(79,209,197,.12);
  --sel-wash:rgba(255,126,171,.22); --tband:rgba(255,126,171,.08); --dot:rgba(200,225,245,.30);
  --aur-1:rgba(79,209,197,.13); --aur-2:rgba(255,126,171,.12); --aur-3:rgba(80,120,220,.16);
  --edge:linear-gradient(140deg,rgba(110,224,216,.45),rgba(234,242,249,.08) 38%,rgba(234,242,249,.08) 62%,rgba(255,126,171,.5));
  --grad:linear-gradient(120deg,#3cc4c0,#5f8fe0 48%,#ff7eab);
  --grad-soft:linear-gradient(135deg,rgba(79,209,197,.12),rgba(255,126,171,.12));
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 20px 44px -16px rgba(0,0,0,.7);
  --glow:0 0 0 4px rgba(255,126,171,.18);
  --lilac:#c3b0f5; --pearl:linear-gradient(115deg,rgba(110,224,216,.10),rgba(196,170,240,.10) 45%,rgba(255,126,171,.10)); --bubble:rgba(200,230,255,.35);
  color-scheme:dark}

*{box-sizing:border-box}
html{font-size:calc(100% * var(--ts,1));-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light;overscroll-behavior:none}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:calc(17px * var(--ts,1));line-height:1.55;-webkit-font-smoothing:antialiased}
/* aurora and a scatter of tiny stars, fixed behind everything */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1.2px 1.2px at 12% 18%,var(--dot) 50%,transparent 51%),
    radial-gradient(1px 1px at 72% 12%,var(--dot) 50%,transparent 51%),
    radial-gradient(1.4px 1.4px at 88% 46%,var(--dot) 50%,transparent 51%),
    radial-gradient(1px 1px at 34% 62%,var(--dot) 50%,transparent 51%),
    radial-gradient(1.2px 1.2px at 58% 84%,var(--dot) 50%,transparent 51%),
    radial-gradient(1px 1px at 8% 90%,var(--dot) 50%,transparent 51%),
    radial-gradient(60vmax 40vmax at 100% 0%,var(--aur-2),transparent 70%),
    radial-gradient(55vmax 45vmax at 0% 8%,var(--aur-1),transparent 70%),
    radial-gradient(70vmax 50vmax at 50% 110%,var(--aur-3),transparent 70%),
    var(--paper);
  background-size:260px 260px,330px 330px,290px 290px,370px 370px,310px 310px,240px 240px,100% 100%,100% 100%,100% 100%,100% 100%}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:.005em;line-height:1.15}
h2{font-size:1.85rem}
h3{font-size:1.4rem}
.it{font-family:var(--f-italic);font-style:italic;font-weight:500}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.gl{font-family:var(--f-glyph);font-style:normal}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
a{color:var(--teal)}
::selection{background:var(--sel-wash)}

/* masthead */
.mast{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--turq) 20%,var(--rose) 80%,transparent) 1}
.logo{width:74px;height:74px;flex:none;filter:drop-shadow(0 4px 14px rgba(239,143,179,.35))}
.mast-t{min-width:0}
.mast h1{font-family:var(--f-script);font-size:clamp(2.6rem,7vw,3.9rem);line-height:1.15;color:var(--ink);font-weight:400;letter-spacing:0;white-space:nowrap}
.mast h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.mast .sub{font-family:var(--f-italic);font-style:italic;font-size:1.1rem;color:var(--ink-soft);margin-top:4px}
.who{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.who .nm{font-family:var(--f-italic);font-style:italic;font-weight:600;font-size:1.3rem}
.who .meta{font-family:var(--f-mono);font-size:.82rem;color:var(--ink-soft)}
@media (max-width:640px){.who{margin-left:0;text-align:left;align-items:flex-start;width:100%}}

.btn{border:1px solid var(--ink-line);background:var(--card);border-radius:999px;padding:7px 18px;cursor:pointer;font-family:var(--f-label);font-weight:500;font-size:.95rem;letter-spacing:.02em;box-shadow:0 1px 2px rgba(26,47,85,.06)}
.btn:hover{border-color:var(--pink);color:var(--pink)}
.btn.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px -6px rgba(201,58,114,.55)}
.btn.pri:hover{color:#fff;filter:brightness(1.06) saturate(1.1)}
.btn.sm{padding:5px 13px;font-size:.86rem}

/* tabs: a floating pill bar */
nav.tabs{display:inline-flex;gap:4px;flex-wrap:wrap;margin:16px 0 20px;padding:5px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
nav.tabs button{background:none;border:0;border-radius:999px;padding:8px 20px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.2rem;color:var(--ink-soft)}
nav.tabs button[aria-selected="true"]{color:#fff;background:var(--grad);box-shadow:0 6px 16px -6px rgba(201,58,114,.5)}
nav.tabs button:not([aria-selected="true"]):hover{color:var(--pink);background:var(--sel-wash)}

/* cards: rounded, with a turquoise-to-rose hairline edge */
.panel{background:linear-gradient(180deg,var(--card),var(--card-2)) padding-box,var(--edge) border-box;border:1px solid transparent;border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:880px){.split{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--f-label);font-weight:700;font-size:.74rem;letter-spacing:.2em;color:var(--pink);text-transform:uppercase}
.muted{color:var(--ink-soft)}
.note{font-size:.92rem;color:var(--ink-soft)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid rgba(239,143,179,.45);background:var(--grad-soft),var(--card);padding:12px 16px;border-radius:var(--r-md);margin-bottom:16px;box-shadow:var(--shadow)}
.banner p{margin:0;flex:1;min-width:220px}

/* form */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-family:var(--f-label);font-weight:500;font-size:.85rem;letter-spacing:.04em;color:var(--ink-soft)}
.form input,.form select{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--f-body);font-size:1rem;min-width:0;transition:border-color .15s,box-shadow .15s}
.form input:focus,.form select:focus,.srch:focus,.day-note:focus{outline:none;border-color:var(--rose);box-shadow:var(--glow)}
.form .chk{flex-direction:row;align-items:center;gap:8px;align-self:end;padding-bottom:8px}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.err{color:var(--pink);font-size:.95rem}

/* big three */
.big3{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.b3{flex:1;min-width:150px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;cursor:pointer;background:var(--card);text-align:left;box-shadow:var(--shadow)}
.b3:hover{border-color:var(--rose)}
/* seals: a glyph inside a fine ring with a dotted inner ring, like the logo. app.js centres each glyph by its ink (centerGlyphs). */
.b3 .gl,.detail h3 .gl,.gcard .gi,.qprompt .qg,.pot .pi,.me-card .gl{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;line-height:1;font-family:var(--f-glyph);font-style:normal;color:var(--pink);background:var(--card);border:1px solid rgba(201,58,114,.5);text-align:center}
.b3 .gl::after,.detail h3 .gl::after,.gcard .gi::after,.qprompt .qg::after,.pot .pi::after,.me-card .gl::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dotted rgba(201,58,114,.45);pointer-events:none}
.b3 .gl{width:46px;height:46px;font-size:1.4rem}
.b3 small{display:block;font-family:var(--f-label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-size:.66rem}
.b3 b{font-family:var(--f-display);font-weight:600;font-size:1.3rem;line-height:1.1}

/* wheel */
.wheel{width:100%;height:auto;max-width:680px;display:block;margin:0 auto;user-select:none}
.wheel text{font-family:var(--f-mono)}
.wheel{filter:drop-shadow(0 10px 24px rgba(26,47,85,.12))}
.w-zbg{fill:var(--card);stroke:var(--line)}
.w-tband{fill:var(--tband);stroke:var(--ink-line)}
.w-sign{cursor:pointer}
.w-sign path{stroke:var(--line);stroke-width:.8}
.w-sign text{font-family:var(--f-glyph)!important;font-size:23px}
.el-fire path{fill:var(--fire-wash)} .el-fire text{fill:var(--fire)}
.el-earth path{fill:var(--earth-wash)} .el-earth text{fill:var(--earth)}
.el-air path{fill:var(--air-wash)} .el-air text{fill:var(--air)}
.el-water path{fill:var(--water-wash)} .el-water text{fill:var(--water)}
.w-sign:hover path,.w-sign.sel path{fill:var(--sel-wash)}
.ring{fill:none;stroke:var(--ink-line);stroke-width:.7}
.ring.dot{stroke-dasharray:1.5 3}
.tick{stroke:var(--ink-soft);stroke-width:.6}
.cusp{stroke:var(--ink-soft);stroke-width:.7}
.cusp.ang{stroke:var(--ink);stroke-width:1.7}
.angl{font-size:11px;fill:var(--pink);font-weight:700}
.hbtn{cursor:pointer}
.hbtn circle{fill:var(--tband);stroke:var(--rose);stroke-width:1}
.hnum{font-family:var(--f-label)!important;font-size:13px;fill:var(--pink);font-weight:700}
.hbtn:hover circle,.hbtn.sel circle{fill:var(--pink);stroke:var(--pink)}
.hbtn:hover .hnum,.hbtn.sel .hnum{fill:var(--card)}
.w-pl{cursor:pointer}
.w-pl .g{font-family:var(--f-glyph)!important;font-size:22px;fill:var(--ink)}
.w-pl.tr .g{fill:var(--pink)}
.w-pl .deg{font-size:10.5px;fill:var(--ink-soft)}
.w-pl .lead{stroke:var(--ink-line);stroke-width:.6}
.w-pl .tk{stroke:var(--ink);stroke-width:1.4}
.w-pl.tr .tk{stroke:var(--pink)}
.w-pl .hit{fill:var(--card);fill-opacity:.55;stroke:var(--rose);stroke-width:.9;opacity:.85}
.w-pl.sel .hit{stroke:var(--pink);stroke-width:1.6;opacity:1}
.w-pl:hover .hit,.w-pl.sel .hit{fill:var(--sel-wash)}
.asp{stroke-width:1.1;fill:none}
.tap-hint{text-align:center;margin:0 0 8px;font-family:var(--f-italic);font-style:italic;font-weight:600;color:var(--pink);font-size:1.1rem}
.tap-hint::before{content:"☞ ";font-family:var(--f-body)}
@media (prefers-reduced-motion:no-preference){.intro .hbtn circle,.intro .w-pl .hit{animation:tapme 1.6s ease-in-out 2}}
@keyframes tapme{50%{stroke-width:2.6;stroke:var(--pink)}}
.asp-soft{stroke:var(--teal)} .asp-hard{stroke:var(--pink)} .asp-odd{stroke:var(--sky-ink);stroke-dasharray:4 3} .asp-neu{stroke:var(--earth)}
.asp.dim{opacity:.1} .asp.hi{stroke-width:2.4}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-family:var(--f-label);font-size:.85rem;color:var(--ink-soft);margin-top:10px}
.legend i{display:inline-block;width:20px;height:0;border-top:2px solid;border-radius:2px;vertical-align:middle;margin-right:6px}

/* detail */
.detail h3{display:flex;align-items:center;gap:10px}
.detail h3 .gl{width:46px;height:46px;font-size:1.4rem}
.detail .pos{font-family:var(--f-mono);font-size:.92rem;letter-spacing:.03em;color:var(--ink-soft);margin:4px 0 10px}
.detail p{margin:.5em 0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:10px 0;font-size:.98rem}
.kv dt{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-size:.7rem;padding-top:5px}
.kv dd{margin:0}
.ctx{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.ctx li{border-left:3px solid var(--sky);border-radius:2px;padding-left:12px}
.ctx li.hard{border-left-color:var(--pink)} .ctx li.soft{border-left-color:var(--teal)}
.ctx li span{display:block;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-family:var(--f-label);font-size:.86rem;background:var(--card);cursor:pointer;margin:2px 3px 2px 0;box-shadow:0 1px 2px rgba(26,47,85,.05)}
.chip:hover{border-color:var(--rose);background:var(--tband)}
.chip .gl{color:var(--pink)}

/* tables & lists */
.prow{display:grid;grid-template-columns:1.6em 5.6em 1fr auto auto;gap:6px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:var(--r-sm);padding:10px 8px;color:inherit;font:inherit;cursor:pointer}
.prow:hover{background:var(--tband)}
.prow .pd,.prow .ph{font-family:var(--f-label);font-size:.85rem;color:var(--ink-soft)}
@media(max-width:520px){.prow{grid-template-columns:1.6em 1fr auto;row-gap:0}.prow .pd{grid-column:2;grid-row:2}.prow .ph{grid-column:3;grid-row:2;text-align:right}}
.sky-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}.sky-bar .mono{flex:1;min-width:9em;text-align:center;font-size:.85rem}
.ctx li .rt{margin:2px 0}.ctx li .rt span{display:inline;font-family:inherit;letter-spacing:normal;font-size:inherit;color:inherit}.ctx li .rt .gl{font-family:var(--f-glyph)}
.seg{display:flex;gap:4px;margin:0 0 16px;padding:4px;border-radius:20px;background:var(--paper-2);border:1px solid var(--line)}.seg button{flex:1;padding:9px 4px;border:0;background:none;color:var(--ink-soft);font-family:var(--f-label);font-weight:500;font-size:.95rem;border-radius:16px;cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--pink);background:var(--card);box-shadow:0 2px 8px -2px rgba(26,47,85,.2);font-weight:700}.seg.sm button{font-size:.85rem;padding:7px 4px}
.rguide{margin:6px 0 14px}.rguide summary{cursor:pointer;color:var(--teal);font-family:var(--f-italic);font-style:italic;font-weight:600;font-size:1.1rem}
.rcard{border:1px solid var(--line);border-radius:var(--r-md);margin:0 0 10px;background:var(--card);box-shadow:inset 4px 0 0 var(--rose),var(--shadow)}

.m-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.m-dims{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:560px){.m-dims{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:880px){.m-dims{grid-template-columns:repeat(3,minmax(0,1fr))}}
.m-dim{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.m-seal{grid-row:span 2;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--lilac);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),transparent 45%),var(--pearl);border:1px solid var(--ink-line);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.m-dn{font-family:var(--f-label);font-weight:700;font-size:.92rem}.m-dp{font-family:var(--f-display);font-size:1.3rem;color:var(--pink)}
.m-bar{grid-column:2/4;height:7px;border-radius:4px;background:var(--line);overflow:hidden}.m-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--turq),var(--lilac),var(--rose))}
.m-dt{grid-column:1/4;font-size:.88rem;color:var(--ink-soft);line-height:1.35;margin-top:4px}
.m-story{padding:16px 18px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line)}
.m-story h4{font-family:var(--f-italic);font-style:italic;color:var(--teal);margin:14px 0 4px;font-size:1.15rem}.m-story p{margin:0 0 6px}
.m-signs{display:grid;gap:10px}@media (min-width:880px){.m-signs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.m-sign{padding:12px 14px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line)}.m-sign p{margin:8px 0 0;font-size:.95rem}
.m-pair{display:flex;align-items:center;justify-content:center;gap:12px}
.m-shell{display:flex;flex-direction:column;align-items:center;gap:2px;border:0}.m-shell .gl{font-size:1.5rem;color:var(--pink);width:44px;height:44px;display:grid;place-items:center;border-radius:50% 50% 46% 46%;background:var(--pearl);border:1px solid var(--ink-line)}
.m-shell small{font-family:var(--f-label);font-size:.74rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
.m-tie{font-size:1.4rem;color:var(--lilac)}.m-sign.r3 .m-tie,.m-sign.r5 .m-tie{color:var(--pink)}.m-sign.r2 .m-tie,.m-sign.r4 .m-tie,.m-sign.r0 .m-tie{color:var(--teal)}
.m-cols{display:grid;gap:0 18px}@media (min-width:880px){.m-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.m-link{padding:11px 14px;margin:0 0 10px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--lilac)}
.m-link.soft{box-shadow:inset 3px 0 0 var(--turq)}.m-link.hard{box-shadow:inset 3px 0 0 var(--rose)}
.m-lh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-family:var(--f-label);font-weight:700;font-size:.9rem}.m-asp{color:var(--lilac)}
.m-topic{font-family:var(--f-italic);font-style:italic;color:var(--ink-soft);font-size:.98rem}.m-link p{margin:4px 0 0;font-size:.94rem}
.m-comp{display:grid;gap:10px}@media (min-width:880px){.m-comp{grid-template-columns:repeat(2,minmax(0,1fr))}}
.m-cc,.m-land{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line)}
.m-land{margin-bottom:10px}.m-land>.gl{font-size:1.3rem;color:var(--pink);flex:none;width:28px;text-align:center}.m-cc .m-seal{flex:none}
.m-days{display:grid;grid-template-columns:repeat(14,minmax(38px,1fr));gap:5px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.m-pearl i{background:linear-gradient(0deg,var(--lilac),var(--sky))!important}.m-pearl.good i{background:linear-gradient(0deg,var(--turq),var(--sky))!important}.m-pearl.hard i{background:linear-gradient(0deg,var(--pink),var(--rose))!important}
.m-pearl{border-radius:6px 6px 8px 8px}
.m-dayrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.m-dayrow b{font-family:var(--f-italic);font-style:italic;font-size:1.1rem;margin-right:4px}
.chip.good{border-color:var(--turq)}.chip.hard{border-color:var(--rose)}
.m-lh4{font-family:var(--f-italic);font-style:italic;color:var(--teal);margin:4px 0 8px;font-size:1.1rem}.m-all{margin-top:22px}.m-all summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.2rem;margin-bottom:10px}
.m-honest{margin-top:20px;text-align:center;font-style:italic}
.m-quick{margin-top:14px;padding:16px;border-radius:var(--r-md);background:var(--card);border:1px dashed var(--lilac)}.m-quick h3{font-family:var(--f-italic);font-style:italic;margin:0}
@media (prefers-reduced-motion:no-preference){
  .m-bubbles i{animation:mfloat 7s ease-in-out infinite}.m-bubbles i:nth-child(2n){animation-duration:9s;animation-delay:-3s}.m-bubbles i:nth-child(3n){animation-duration:11s;animation-delay:-5s}
  .m-arc{animation:mring 1.4s cubic-bezier(.2,.8,.2,1)}.m-bar i{animation:grow 1s cubic-bezier(.2,.8,.2,1)}
  .m-arch{background-size:200% 100%;animation:mshim 6s ease-in-out infinite}
}
@keyframes mfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px) translateX(4px)}}
@keyframes mring{from{stroke-dasharray:0 400}}
@keyframes mshim{0%,100%{background-position:0 0}50%{background-position:100% 0}}
</style>
</head>

        <div class="panel"><h2 data-i18n="language"></h2><div class="langs" id="langs" style="margin-top:10px"></div></div>
        <div class="panel" id="ts-panel"><h2 data-i18n="textSize"></h2><div class="langs" id="text-sizes" style="margin-top:10px;align-items:center"></div></div>
        <div class="panel" id="fav-panel"><h2 data-i18n="favTitle"></h2><p class="note" style="margin:4px 0 10px" data-i18n="favNote"></p><div id="fav-list" class="clist"></div></div>
        <div class="panel" id="backup-panel"><h2 data-i18n="backupTitle"></h2><p class="note" style="margin:4px 0 10px" data-i18n="backupNote"></p>
          <div class="form-actions"><button class="btn pri" type="button" id="backup-save" data-i18n="backupSave"></button><button class="btn" type="button" id="backup-load" data-i18n="backupLoad"></button><input type="file" id="backup-file" accept="application/json,.json" hidden></div>
          <p class="note" id="backup-msg" aria-live="polite" style="margin:8px 0 0"></p></div>
        <div id="install-card" class="install" hidden>
          <img src="icons/icon-192.png" alt="">
          <p id="install-text"></p>
          <button class="btn pri sm" type="button" id="install-btn" hidden data-i18n="install"></button>
        </div>
        <div class="panel" id="me-charts"><h2 data-i18n="savedCharts"></h2><p class="note" style="margin:4px 0 10px" data-i18n="savedNote"></p>
          <div id="chart-list" class="clist"></div>
          <div class="form-actions"><button class="btn pri" type="button" id="add-chart" data-i18n="addChart"></button></div></div>
        <div id="form-panel" class="panel">
          <h2 id="form-title"></h2>
          <p class="note" style="margin:4px 0 0" data-i18n="birthNote"></p>
          <form id="bform" autocomplete="off">
            <div class="form">
              <label><span data-i18n="fName"></span><input id="f-name" type="text" maxlength="40"></label>
              <label><span data-i18n="fDate"></span><input id="f-date" type="date" required></label>
              <label><span data-i18n="fTime"></span><input id="f-time" type="time"></label>
              <label class="chk"><input id="f-unknown" type="checkbox"> <span data-i18n="fUnknown"></span></label>
              <label><span data-i18n="fPlace"></span><select id="f-city"></select></label>
              <label><span data-i18n="fLat"></span><input id="f-lat" type="number" step="0.01" min="-89.9" max="89.9" required></label>
              <label><span data-i18n="fLon"></span><input id="f-lon" type="number" step="0.01" min="-180" max="180" required></label>
              <label><span data-i18n="fTz"></span><input id="f-tz" type="text" placeholder="Europe/Athens / UTC+2" required></label>
              <label><span data-i18n="fSys"></span><select id="f-sys"><option value="placidus">Placidus</option><option value="whole" data-i18n="sysWhole"></option><option value="equal" data-i18n="sysEqual"></option></select></label>
            </div>
            <div class="form-actions">
              <button class="btn pri" type="submit" id="f-submit"></button>
              <button class="btn" type="button" id="f-cancel" data-i18n="cancel"></button>
              <span class="err" id="f-err"></span>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer><span>Astro Pisces</span><span data-i18n="footer"></span></footer>
</div>

<div id="tour-win" class="twin" role="dialog" aria-modal="true" aria-labelledby="tour-title" hidden>
  <div class="twin-bar"><div><div class="eyebrow" id="tour-title"></div><div class="twin-sub" id="tour-sub"></div></div><button class="sheet-x" type="button" id="tour-x" data-tour="close">×</button></div>
  <div class="twin-track" id="tour-track"></div>
  <div class="twin-foot"><button class="btn" type="button" id="tour-back" data-tour="back"></button><div class="tdots" id="tour-dots"></div><button class="btn pri" type="button" id="tour-next" data-tour="next"></button></div>
</div>
<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-grab" id="sheet-grab"><button class="sheet-back" type="button" id="sheet-back" hidden>‹ <span data-i18n="back"></span></button><i></i><button class="sheet-fav" type="button" id="sheet-fav" hidden>☆</button><button class="sheet-x" type="button" id="sheet-x" data-i18n-aria="close">×</button></div>
  <div id="sheet-body"></div>
</div>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Fishes</title>
<meta name="description" content="Your birth chart, transits through time and astrology games.">
<meta name="theme-color" content="#eef6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1a2d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Two Fishes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Courier+Prime:wght@400;700&family=Noto+Sans+Symbols:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js" crossorigin="anonymous"></script>
</body>
</html>
<style>
/* Layout: an old celestial almanac printed in sea-blue ink with rose accents; wheel left, reading notes right. */
:root{
  --paper:#eef6f9; --paper-2:#e1eef4; --card:#f8fcfd;
  --ink:#1b3358; --ink-soft:#4f6a8c; --ink-line:rgba(27,51,88,.42); --line:rgba(27,51,88,.16);
  --teal:#13878f; --turq:#3cc4c0; --sky:#8ecae6; --sky-ink:#3d86b8;
  --pink:#c93a72; --rose:#ef8fb3; --blush:#f8d7e3;
  --fire:#c93a72; --earth:#6a78bd; --air:#3d86b8; --water:#13878f;
  --fire-wash:rgba(239,143,179,.20); --earth-wash:rgba(130,144,214,.16); --air-wash:rgba(142,202,230,.26); --water-wash:rgba(60,196,192,.18);
  --sel-wash:rgba(239,143,179,.32); --tband:rgba(248,215,227,.45); --dot:rgba(61,134,184,.13);
  --f-display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --f-italic:"IM Fell English",Georgia,serif;
  --f-body:"EB Garamond",Garamond,Georgia,serif;
  --f-mono:"Courier Prime","Courier New",monospace;
  --f-glyph:"Noto Sans Symbols","Segoe UI Symbol","Apple Symbols",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0c1a2d; --paper-2:#12253e; --card:#102139;
  --ink:#e7f1f8; --ink-soft:#9db6cf; --ink-line:rgba(231,241,248,.38); --line:rgba(231,241,248,.14);
  --teal:#4fd1c5; --turq:#6ee0d8; --sky:#8ecae6; --sky-ink:#8ecae6;
  --pink:#ff7eab; --rose:#ffa3c4; --blush:#3a2442;
  --fire:#ff7eab; --earth:#a3adf0; --air:#8ecae6; --water:#4fd1c5;
  --fire-wash:rgba(255,126,171,.13); --earth-wash:rgba(163,173,240,.11); --air-wash:rgba(142,202,230,.13); --water-wash:rgba(79,209,197,.12);
  --sel-wash:rgba(255,126,171,.28); --tband:rgba(255,126,171,.08); --dot:rgba(142,202,230,.07);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1a2d; --paper-2:#12253e; --card:#102139;
  --ink:#e7f1f8; --ink-soft:#9db6cf; --ink-line:rgba(231,241,248,.38); --line:rgba(231,241,248,.14);
  --teal:#4fd1c5; --turq:#6ee0d8; --sky:#8ecae6; --sky-ink:#8ecae6;
  --pink:#ff7eab; --rose:#ffa3c4; --blush:#3a2442;
  --fire:#ff7eab; --earth:#a3adf0; --air:#8ecae6; --water:#4fd1c5;
  --fire-wash:rgba(255,126,171,.13); --earth-wash:rgba(163,173,240,.11); --air-wash:rgba(142,202,230,.13); --water-wash:rgba(79,209,197,.12);
  --sel-wash:rgba(255,126,171,.28); --tband:rgba(255,126,171,.08); --dot:rgba(142,202,230,.07);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:1.6rem}
h3{font-size:1.2rem}
.it{font-family:var(--f-italic);font-style:italic}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gl{font-family:var(--f-glyph);font-style:normal}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
a{color:var(--teal)}

/* masthead */
.mast{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:4px double var(--ink-line)}
.logo{width:74px;height:74px;flex:none}
.mast-t{min-width:0}
.mast h1{font-size:clamp(2rem,6vw,3rem);line-height:1;color:var(--ink)}
.mast h1 span{color:var(--pink)}
.mast .sub{font-family:var(--f-italic);font-style:italic;color:var(--ink-soft);margin-top:4px}
.who{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.who .nm{font-family:var(--f-italic);font-size:1.15rem}
.who .meta{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-soft)}
@media (max-width:640px){.who{margin-left:0;text-align:left;align-items:flex-start;width:100%}}

.btn{border:1px solid var(--ink-line);background:var(--card);border-radius:3px;padding:6px 14px;cursor:pointer;font-family:var(--f-display);font-size:.95rem;letter-spacing:.04em}
.btn:hover{border-color:var(--pink);color:var(--pink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover{background:var(--pink);border-color:var(--pink);color:var(--paper)}
.btn.sm{padding:3px 10px;font-size:.85rem}

/* tabs */
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 18px;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px 7px;cursor:pointer;font-family:var(--f-display);font-size:1.15rem;color:var(--ink-soft)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pink)}
nav.tabs button:hover{color:var(--pink)}

/* framed panels: an engraved double rule */
.panel{background:var(--card);border:1px solid var(--ink-line);border-radius:2px;padding:18px;box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:880px){.split{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--f-display);font-size:.85rem;letter-spacing:.14em;color:var(--pink);text-transform:uppercase}
.muted{color:var(--ink-soft)}
.note{font-size:.92rem;color:var(--ink-soft)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px dashed var(--pink);background:var(--tband);padding:10px 14px;border-radius:3px;margin-bottom:16px}
.banner p{margin:0;flex:1;min-width:220px}

/* form */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-family:var(--f-display);font-size:.9rem;letter-spacing:.03em;color:var(--ink-soft)}
.form input,.form select{background:var(--paper);border:1px solid var(--ink-line);border-radius:3px;padding:7px 9px;font-family:var(--f-body);font-size:1rem;min-width:0}
.form .chk{flex-direction:row;align-items:center;gap:8px;align-self:end;padding-bottom:8px}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.err{color:var(--pink);font-size:.95rem}

/* big three */
.big3{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.b3{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--ink-line);border-bottom:1px solid var(--ink-line);padding:8px 4px;cursor:pointer;background:none;border-left:0;border-right:0;text-align:left}
.b3:hover{background:var(--sel-wash)}
.b3 .gl{font-size:1.7rem;color:var(--pink);width:1.6em;text-align:center}
.b3 small{display:block;font-family:var(--f-display);letter-spacing:.08em;color:var(--ink-soft);font-size:.8rem}
.b3 b{font-weight:500;font-size:1.1rem}

/* wheel */
.wheel{width:100%;height:auto;max-width:680px;display:block;margin:0 auto;user-select:none}
.wheel text{font-family:var(--f-mono)}
.w-zbg{fill:var(--card);stroke:var(--ink-line)}
.w-tband{fill:var(--tband);stroke:var(--ink-line)}
.w-sign{cursor:pointer}
.w-sign path{stroke:var(--ink-line);stroke-width:.8}
.w-sign text{font-family:var(--f-glyph)!important;font-size:23px}
.el-fire path{fill:var(--fire-wash)} .el-fire text{fill:var(--fire)}
.el-earth path{fill:var(--earth-wash)} .el-earth text{fill:var(--earth)}
.el-air path{fill:var(--air-wash)} .el-air text{fill:var(--air)}
.el-water path{fill:var(--water-wash)} .el-water text{fill:var(--water)}
.w-sign:hover path,.w-sign.sel path{fill:var(--sel-wash)}
.ring{fill:none;stroke:var(--ink-line);stroke-width:.9}
.ring.dot{stroke-dasharray:1.5 3}
.tick{stroke:var(--ink-soft);stroke-width:.6}
.cusp{stroke:var(--ink-soft);stroke-width:.7}
.cusp.ang{stroke:var(--ink);stroke-width:1.7}
.angl{font-size:11px;fill:var(--pink);font-weight:700}
.hnum{font-size:13px;fill:var(--ink-soft);cursor:pointer}
.hnum:hover,.hnum.sel{fill:var(--pink);font-weight:700}
.w-pl{cursor:pointer}
.w-pl .g{font-family:var(--f-glyph)!important;font-size:22px;fill:var(--ink)}
.w-pl.tr .g{fill:var(--pink)}
.w-pl .deg{font-size:10.5px;fill:var(--ink-soft)}
.w-pl .lead{stroke:var(--ink-line);stroke-width:.6}
.w-pl .tk{stroke:var(--ink);stroke-width:1.4}
.w-pl.tr .tk{stroke:var(--pink)}
.w-pl .hit{fill:transparent}
.w-pl:hover .hit,.w-pl.sel .hit{fill:var(--sel-wash)}
.asp{stroke-width:1.1;fill:none}
.asp-soft{stroke:var(--teal)} .asp-hard{stroke:var(--pink)} .asp-odd{stroke:var(--sky-ink);stroke-dasharray:4 3} .asp-neu{stroke:var(--earth)}
.asp.dim{opacity:.1} .asp.hi{stroke-width:2.4}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:.85rem;color:var(--ink-soft);margin-top:8px}
.legend i{display:inline-block;width:20px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}

/* detail */
.detail h3{display:flex;align-items:center;gap:10px}
.detail h3 .gl{font-size:1.8rem;color:var(--pink)}
.detail .pos{font-family:var(--f-mono);font-size:.95rem;color:var(--ink-soft);margin:4px 0 10px}
.detail p{margin:.5em 0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:10px 0;font-size:.98rem}
.kv dt{font-family:var(--f-display);letter-spacing:.05em;color:var(--ink-soft);font-size:.9rem;padding-top:2px}
.kv dd{margin:0}
.ctx{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.ctx li{border-left:2px solid var(--sky);padding-left:10px}
.ctx li.hard{border-left-color:var(--pink)} .ctx li.soft{border-left-color:var(--teal)}
.ctx li span{display:block;font-family:var(--f-display);letter-spacing:.07em;font-size:.82rem;color:var(--ink-soft)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.88rem;background:var(--paper);cursor:pointer;margin:2px 3px 2px 0}
.chip:hover{border-color:var(--pink)}
.chip .gl{color:var(--pink)}

/* tables & lists */
.prow{display:grid;grid-template-columns:1.6em 5.6em 1fr auto auto;gap:6px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;color:inherit;font:inherit;cursor:pointer}
.prow .pd,.prow .ph{font-size:.85rem;color:var(--ink-soft)}
@media(max-width:520px){.prow{grid-template-columns:1.6em 1fr auto;row-gap:0}.prow .pd{grid-column:2;grid-row:2}.prow .ph{grid-column:3;grid-row:2;text-align:right}}
.sky-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}.sky-bar .mono{flex:1;min-width:9em;text-align:center;font-size:.85rem}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.98rem}
th{font-family:var(--f-display);font-weight:400;letter-spacing:.06em;color:var(--ink-soft);text-align:left;border-bottom:1px solid var(--ink-line);padding:6px 8px;font-size:.9rem}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sel-wash)}
td .gl{color:var(--pink);font-size:1.15rem}
.alist{display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:5.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.aitem:hover,.aitem.sel{background:var(--sel-wash)}
.aitem .gls{font-family:var(--f-glyph);font-size:1.25rem;letter-spacing:.08em;white-space:nowrap}
.aitem .gls .t{color:var(--pink)}
.aitem .gls .a.hard{color:var(--pink)} .aitem .gls .a.soft{color:var(--teal)} .aitem .gls .a.odd,.aitem .gls .a.neu{color:var(--earth)}
.aitem .sub{font-size:.85rem;color:var(--ink-soft)}
.aitem .orb{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-soft);text-align:right;white-space:nowrap}

/* transits controls */
.tctl{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.tdate{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tdate .big{font-family:var(--f-italic);font-size:1.7rem}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=range]{width:100%;accent-color:var(--pink)}
.rng-lab{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.75rem;color:var(--ink-soft)}
.houses{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hcell{border:1px solid var(--line);border-radius:3px;padding:7px 9px;cursor:pointer;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:3px}
.hcell:hover{border-color:var(--pink)}
.hcell.hot{border-color:var(--pink);background:var(--tband)}
.hcell .hn{font-family:var(--f-display);font-size:.95rem}
.hcell .hs{font-size:.8rem;color:var(--ink-soft);line-height:1.2}
.hcell .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.hcell .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--turq),var(--pink))}
.hcell .pls{font-family:var(--f-glyph);color:var(--pink);min-height:1.2em;font-size:.95rem}
.tl-wrap{overflow-x:auto}
.tl{min-width:640px;width:100%;height:auto;display:block}
.tl text{font-family:var(--f-mono);font-size:11px;fill:var(--ink-soft)}
.tl .gl{font-family:var(--f-glyph)!important;font-size:14px;fill:var(--ink)}
.tl .row{cursor:pointer}
.tl .row:hover .bg{fill:var(--sel-wash)}
.tl .bg{fill:transparent}
.tl .grid{stroke:var(--line)}
.tl .now{stroke:var(--pink);stroke-dasharray:3 3}
.tl .cur{stroke:var(--ink);stroke-width:1.5}
.tl .b-soft{fill:var(--teal)} .tl .b-hard{fill:var(--pink)} .tl .b-neu{fill:var(--earth)} .tl .b-odd{fill:var(--sky-ink)}
.tl .ex{fill:var(--card);stroke:var(--ink);stroke-width:1.2}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gcard{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--card);border:1px solid var(--ink-line);border-radius:2px;box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--line)}
.gcard:hover{border-color:var(--pink)}
.gcard .gi{font-family:var(--f-glyph);font-size:2rem;color:var(--pink);line-height:1}
.gcard h3{font-size:1.25rem}
.gcard p{margin:0;font-size:.95rem;color:var(--ink-soft)}
.gcard .best{font-family:var(--f-mono);font-size:.78rem;color:var(--teal);margin-top:auto}
.quiz{max-width:640px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;border:1px solid var(--ink-line);display:block}
.dots i.ok{background:var(--teal);border-color:var(--teal)} .dots i.no{background:var(--pink);border-color:var(--pink)} .dots i.cur{border-color:var(--pink);border-width:2px}
.qprompt{text-align:center;margin:22px 0 18px}
.qprompt .qg{font-family:var(--f-glyph);font-size:4.2rem;line-height:1.1;color:var(--pink);display:block}
.qprompt .qt{font-family:var(--f-italic);font-size:1.35rem}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.qopt{padding:11px 14px;border:1px solid var(--ink-line);border-radius:3px;background:var(--paper);cursor:pointer;font-size:1.05rem;text-align:center}
.qopt:hover:not(:disabled){border-color:var(--pink);color:var(--pink)}
.qopt.right{background:var(--water-wash);border-color:var(--teal);color:var(--ink)}
.qopt.wrong{background:var(--fire-wash);border-color:var(--pink);color:var(--ink)}
.qopt:disabled{cursor:default}
.qfb{margin-top:16px;padding:12px 14px;border-left:3px solid var(--teal);background:var(--paper)}
.qfb.no{border-left-color:var(--pink)}
.qfb b{font-family:var(--f-display);font-weight:400;letter-spacing:.04em}
.score{text-align:center;padding:24px 0}
.score .n{font-family:var(--f-display);font-size:4rem;color:var(--pink);line-height:1}

footer{margin-top:36px;padding-top:12px;border-top:4px double var(--ink-line);font-size:.85rem;color:var(--ink-soft);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.qopt,.btn,.hcell,.chip{transition:border-color .15s,color .15s,background .15s}}

.detail h4,#sheet-body h4{font-family:var(--f-display);font-weight:400;font-size:1.02rem;letter-spacing:.05em;color:var(--pink);margin:16px 0 4px}
.explain{background:var(--paper);border-left:3px solid var(--rose);padding:9px 12px;margin:10px 0;font-size:.96rem;border-radius:0 4px 4px 0}
.guide{margin-bottom:14px}
.guide summary{cursor:pointer;font-family:var(--f-display);font-size:1.15rem;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::before{content:'✦';color:var(--pink)}
.guide summary::after{content:'+';margin-left:auto;font-family:var(--f-mono);color:var(--ink-soft)}
.guide[open] summary::after{content:'−'}
.guide[open] summary{margin-bottom:8px}
.guide p{margin:.5em 0}

.tgroup{margin-top:10px}
.tgroup h4{font-family:var(--f-display);font-weight:400;font-size:1.08rem;color:var(--pink);margin:6px 0 0;display:flex;align-items:center;gap:8px}
.tgroup .count{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.tgroup>.note{margin:2px 0 4px}
.lvl{font-size:1.15rem;color:var(--pink);margin:22px 0 10px}
.lvl:first-child{margin-top:4px}
.switch-row{margin-bottom:12px}
.switch-row label{font-family:var(--f-italic);font-style:italic;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.switch-row select{font-family:var(--f-body);font-style:normal;background:var(--card);border:1px solid var(--ink-line);border-radius:999px;padding:5px 12px;font-size:1rem;max-width:70vw}
.clist{display:flex;flex-direction:column}

.lang-btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lang-top{border:1px solid var(--ink-line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 8px;font-family:var(--f-mono);font-size:.8rem;cursor:pointer}

/* calendar */
.cal-head{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.cal-head h3{flex:1;text-align:center;font-size:1.35rem}
.cal-nav{border:1px solid var(--line);background:var(--paper);border-radius:999px;width:36px;height:36px;font-size:1.2rem;line-height:1;cursor:pointer;color:var(--ink)}

.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-family:var(--f-display);font-size:.78rem;letter-spacing:.06em;text-align:center;color:var(--ink-soft);padding-bottom:2px}
.cal-d{min-width:0;aspect-ratio:1/1.1;border:1px solid var(--line);border-radius:9px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 5px;cursor:pointer;color:var(--ink)}
.cal-d:hover{border-color:var(--pink)}
.cal-d .n{font-family:var(--f-mono);font-size:.88rem;font-variant-numeric:tabular-nums}
.cal-d .mg{font-family:var(--f-glyph);font-size:.78rem;line-height:1}
.cal-d .dots{display:flex;gap:2px;height:6px}
.cal-d .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cal-d .dots .soft{background:var(--teal)} .cal-d .dots .hard{background:var(--pink)} .cal-d .dots .neu,.cal-d .dots .odd{background:var(--earth)}
.cal-d.today{border-color:var(--teal);border-width:2px}
.cal-d.sel{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.cal-d.sel .mg{color:var(--paper)!important}
.cal-d.pad{visibility:hidden}
.cal-day h3{font-size:1.25rem}

.cal-day .moon{margin:6px 0 8px;font-size:.98rem}

@media (max-width:879px){.cal-wrap{grid-template-columns:minmax(0,1fr);gap:14px}.cal-grid{gap:3px}.cal-head h3{font-size:1.02rem;white-space:nowrap}.cal-nav{width:32px;height:32px}.cal-head .btn{padding:4px 9px}}

button,.chip,.hcell,.aitem,nav.tabs{touch-action:manipulation;-webkit-user-select:none;user-select:none}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--ink-line);
  box-shadow:0 -10px 40px rgba(8,18,32,.28);max-height:82vh;max-height:82dvh;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;

.sheet-grab{padding:10px 16px 4px;display:flex;justify-content:center;position:relative;cursor:grab;touch-action:none}

.sheet-x{position:absolute;right:10px;top:4px;border:0;background:none;font-size:1.6rem;line-height:1;color:var(--ink-soft);padding:4px 10px;cursor:pointer}
#sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 18px calc(18px + env(safe-area-inset-bottom,0px))}
body.sheet-open{overflow:hidden}

@media (max-width:879px){

    padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));

    background:var(--card);border-top:1px solid var(--ink-line);border-bottom:0;
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));
    box-shadow:0 -4px 18px rgba(8,18,32,.08)}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;letter-spacing:.04em;padding:6px 2px;border-bottom:0;border-radius:12px}
  nav.tabs button[aria-selected="true"]{color:var(--pink);background:var(--sel-wash)}
  .tab-ico{display:block;width:24px;height:24px}
  main{padding-top:12px}
  .banner{margin-top:12px}
  .detail-side{display:none}
  .panel{padding:14px 12px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
  .split{gap:14px}
  .big3{gap:0;flex-wrap:nowrap;margin-bottom:12px}

  .tdate .big{font-size:1.35rem}
  .qopt{padding:14px;font-size:1.08rem}
  footer{display:none}
  .swipe-hint{display:block}
}

            <p class="note" style="margin:2px 0 6px" data-i18n="activeNote"></p>
            <div class="alist" id="transit-list"></div>
          </div>
        </div>
      </div>
      <div class="panel" style="margin-top:22px">
        <h3 data-i18n="lifeAreas"></h3>
        <p class="note" style="margin:2px 0 10px" data-i18n="lifeAreasNote"></p>
        <div class="houses" id="house-weather"></div>
      </div>
      <div class="panel" style="margin-top:22px">
        <h3 data-i18n="yearAhead"></h3>
        <p class="note" style="margin:2px 0 10px" data-i18n="yearAheadNote"></p>
        <div class="tl-wrap" id="timeline"></div>
      </div>
    </section>

    <section id="tab-learn" data-panel="learn" hidden>
      <div id="games-home">
        <p class="it" style="font-size:1.2rem;margin:0 0 14px" data-i18n="learnIntro"></p>
        <div id="games"></div>
      </div>
      <div id="quiz" class="panel quiz" hidden></div>
    </section>

    <section id="tab-me" data-panel="me" hidden>
      <div class="stack">
        <div class="panel"><h2 data-i18n="language"></h2><div class="langs" id="langs" style="margin-top:10px"></div></div>
        <div id="install-card" class="install" hidden>
          <img src="icons/icon-192.png" alt="">
          <p id="install-text"></p>
          <button class="btn pri sm" type="button" id="install-btn" hidden data-i18n="install"></button>
        </div>
        <div class="panel"><h2 data-i18n="savedCharts"></h2><p class="note" style="margin:4px 0 10px" data-i18n="savedNote"></p>
          <div id="chart-list" class="clist"></div>
          <div class="form-actions"><button class="btn pri" type="button" id="add-chart" data-i18n="addChart"></button></div></div>
        <div id="form-panel" class="panel">
          <h2 id="form-title"></h2>
          <p class="note" style="margin:4px 0 0" data-i18n="birthNote"></p>
          <form id="bform" autocomplete="off">
            <div class="form">
              <label><span data-i18n="fName"></span><input id="f-name" type="text" maxlength="40"></label>
              <label><span data-i18n="fDate"></span><input id="f-date" type="date" required></label>
              <label><span data-i18n="fTime"></span><input id="f-time" type="time"></label>
              <label class="chk"><input id="f-unknown" type="checkbox"> <span data-i18n="fUnknown"></span></label>
              <label><span data-i18n="fPlace"></span><select id="f-city"></select></label>
              <label><span data-i18n="fLat"></span><input id="f-lat" type="number" step="0.01" min="-89.9" max="89.9" required></label>
              <label><span data-i18n="fLon"></span><input id="f-lon" type="number" step="0.01" min="-180" max="180" required></label>
              <label><span data-i18n="fTz"></span><input id="f-tz" type="text" placeholder="Europe/Athens / UTC+2" required></label>
              <label><span data-i18n="fSys"></span><select id="f-sys"><option value="placidus">Placidus</option><option value="whole" data-i18n="sysWhole"></option><option value="equal" data-i18n="sysEqual"></option></select></label>
            </div>
            <div class="form-actions">
              <button class="btn pri" type="submit" id="f-submit"></button>
              <button class="btn" type="button" id="f-cancel" data-i18n="cancel"></button>
              <span class="err" id="f-err"></span>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer><span>Two Fishes</span><span data-i18n="footer"></span></footer>
</div>

<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-grab" id="sheet-grab"><i></i><button class="sheet-x" type="button" id="sheet-x" data-i18n-aria="close">×</button></div>
  <div id="sheet-body"></div>
</div>

<script src="i18n/en.js"></script>
<script src="i18n/el.js"></script>
<script src="i18n/it.js"></script>
<script src="app.js"></script>
</body>
</html>
